name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore tests/Fennec.Core.Tests/Fennec.Core.Tests.csproj
          dotnet restore src/Fennec.App/Fennec.App.csproj -r win-x64

      - name: Core and infrastructure behavior tests
        run: dotnet run --project tests/Fennec.Core.Tests -c Release --no-restore

      - name: Publish self-contained developer build
        shell: pwsh
        run: |
          dotnet publish src/Fennec.App/Fennec.App.csproj `
            -c Debug -r win-x64 --self-contained true --no-restore `
            -p:InformationalVersion="0.1.0-dev.${{ github.run_number }}+${{ github.sha }}" `
            -o artifacts/dev
          @{
            configuration = "Debug"
            commit = "${{ github.sha }}"
            run = "${{ github.run_number }}"
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("O")
          } | ConvertTo-Json | Set-Content artifacts/dev/build-info.json

      - name: Upload developer build
        uses: actions/upload-artifact@v7
        with:
          name: fennec-dev-win-x64-${{ github.sha }}
          path: artifacts/dev
          if-no-files-found: error
          retention-days: 14

      - name: Build release and MSI
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/"
          dotnet build installer/Fennec.Installer.wixproj -c Release `
            -p:ProductVersion="0.1.${{ github.run_number }}" `
            -p:SourceRevisionId="${{ github.sha }}" `
            -p:PublishDir="$publishDir"
          Compress-Archive -Path artifacts/release/* -DestinationPath artifacts/Fennec-win-x64.zip -Force
          $msi = Get-ChildItem installer/bin -Recurse -Filter FennecSetup.msi | Select-Object -First 1
          if ($null -eq $msi) { throw "FennecSetup.msi was not produced." }
          Copy-Item $msi.FullName artifacts/FennecSetup-win-x64.msi

      - name: Upload release ZIP
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: fennec-release-win-x64-${{ github.run_number }}
          path: artifacts/Fennec-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSI
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: fennec-msi-win-x64-${{ github.run_number }}
          path: artifacts/FennecSetup-win-x64.msi
          if-no-files-found: error
          retention-days: 30
