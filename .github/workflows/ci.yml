name: Web build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fennec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pinned pnpm with Corepack
        run: |
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile
      - name: Run the local validation gate
        run: pnpm check
      - name: Synthesize account-neutral CDK
        run: pnpm cdk:synth
      - name: Install Chromium
        run: node scripts/playwright.mjs install --with-deps chromium
      - name: Responsive browser tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: fennec-web-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      FENNEC_APP_DOMAIN: ${{ vars.FENNEC_APP_DOMAIN }}
      FENNEC_REDIRECT_DOMAIN: ${{ vars.FENNEC_REDIRECT_DOMAIN }}
      FENNEC_ZONE_NAME: ${{ vars.FENNEC_ZONE_NAME }}
      FENNEC_HOSTED_ZONE_ID: ${{ vars.FENNEC_HOSTED_ZONE_ID }}
      FENNEC_WEB_ACL_ARN: ${{ vars.FENNEC_WEB_ACL_ARN }}
    steps:
      - name: Require personal AWS account configuration
        shell: bash
        run: |
          if [[ -z "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::AWS_ACCOUNT_ID is not configured. Add the personal AWS account ID as a GitHub repository variable after creating FennecGitHubDeployRole."
            exit 1
          fi
          if [[ "$AWS_ACCOUNT_ID" != "309418039962" ]]; then
            echo "::error::AWS_ACCOUNT_ID must be Fennec's personal AWS account 309418039962."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pinned pnpm with Corepack
        run: |
          corepack enable
          corepack install
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/FennecGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: fennec-web-${{ github.sha }}
          path: dist
      - name: Deploy infrastructure
        run: pnpm cdk deploy FennecSite --require-approval never
      - name: Publish application
        shell: bash
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name FennecSite --query 'Stacks[0].Outputs[?OutputKey==`SiteBucketName`].OutputValue' --output text)
          DISTRIBUTION=$(aws cloudformation describe-stacks --stack-name FennecSite --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' --output text)
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html --exclude landing/index.html --exclude sw.js --exclude manifest.webmanifest --exclude registerSW.js --cache-control 'public,max-age=31536000,immutable'
          for FILE in index.html landing/index.html; do
            aws s3 cp "dist/$FILE" "s3://$BUCKET/$FILE" --cache-control 'no-cache,no-store,must-revalidate' --content-type 'text/html; charset=utf-8'
          done
          for FILE in sw.js manifest.webmanifest registerSW.js; do
            if [[ -f "dist/$FILE" ]]; then
              aws s3 cp "dist/$FILE" "s3://$BUCKET/$FILE" --cache-control 'no-cache,must-revalidate'
            fi
          done
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$INVALIDATION_ID"
      - name: Smoke test
        shell: bash
        run: |
          SITE_URL=$(aws cloudformation describe-stacks --stack-name FennecSite --query 'Stacks[0].Outputs[?OutputKey==`SiteUrl`].OutputValue' --output text)
          DEPLOYED_INDEX="$RUNNER_TEMP/fennec-index-$GITHUB_SHA.html"
          DEPLOYED_HEADERS="$RUNNER_TEMP/fennec-index-$GITHUB_SHA.headers"
          curl --fail --retry 8 --retry-delay 10 --dump-header "$DEPLOYED_HEADERS" --output "$DEPLOYED_INDEX" "$SITE_URL/index.html"
          cmp --silent dist/index.html "$DEPLOYED_INDEX" || {
            echo "::error::CloudFront did not serve the index.html from this deployment."
            exit 1
          }
          tr -d '\r' < "$DEPLOYED_HEADERS" | grep --ignore-case --quiet '^cache-control: no-cache,no-store,must-revalidate$' || {
            echo "::error::The deployed SPA shell is missing its no-store cache policy."
            exit 1
          }
          if [[ -n "$FENNEC_REDIRECT_DOMAIN" ]]; then
            LANDING_URL="https://$FENNEC_REDIRECT_DOMAIN"
            LANDING_HTML=$(curl --fail --retry 8 --retry-delay 10 "$LANDING_URL/")
            grep -q 'data-fennec-landing' <<< "$LANDING_HTML"
            REDIRECT_LOCATION=$(curl --silent --show-error --output /dev/null --write-out '%{redirect_url}' "$LANDING_URL/settings?source=apex")
            test "$REDIRECT_LOCATION" = "https://$FENNEC_APP_DOMAIN/settings?source=apex"
          fi
