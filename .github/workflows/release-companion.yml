name: Release Windows companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'src/companion/**'
      - 'src/components/CompanionSettings.tsx'
      - 'src/pages/OnboardingPage.tsx'
      - 'scripts/build-companion-installer.ps1'
      - 'scripts/companion-release-version.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release-companion.yml'

concurrency:
  group: companion-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack install
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-companion
          workspaces: src-tauri -> target
      - name: Cache Tauri bundler tools
        uses: actions/cache@v5
        with:
          path: src-tauri/target/.tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            tauri-bundler-tools-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Derive automatic release version
        shell: pwsh
        run: |
          $version = node scripts/companion-release-version.mjs $env:GITHUB_RUN_NUMBER
          "COMPANION_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          @{
            version = $version
            build = @{ beforeBuildCommand = "" }
          } | ConvertTo-Json -Depth 3 | Set-Content "src-tauri/tauri.release.conf.json"
      - name: Build web application
        run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Prime companion installer tools
        shell: pwsh
        run: ./scripts/build-companion-installer.ps1 -Config src-tauri/tauri.release.conf.json
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/FennecGitHubDeployRole
          aws-region: ${{ vars.AWS_REGION }}
      - name: Load updater signing material
        shell: pwsh
        run: |
          $payload = aws ssm get-parameter `
            --name "/fennec/companion/updater-signing" `
            --with-decryption `
            --query "Parameter.Value" `
            --output text
          $signing = $payload | ConvertFrom-Json
          $keyPath = Join-Path $env:RUNNER_TEMP "fennec-updater.key"
          [IO.File]::WriteAllBytes(
            $keyPath,
            [Convert]::FromBase64String($signing.privateKeyBase64)
          )
          Write-Output "::add-mask::$($signing.password)"
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$($signing.password)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and publish signed companion
        uses: tauri-apps/tauri-action@v1
        env:
          FENNEC_BUILD_VERSION: ${{ env.COMPANION_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: companion-v${{ env.COMPANION_VERSION }}
          releaseName: Fennec Companion v${{ env.COMPANION_VERSION }}
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: Fennec-Companion-Windows-x64[setup][ext]
          args: --config src-tauri/tauri.release.conf.json
      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP/fennec-updater.key" -Force -ErrorAction SilentlyContinue
